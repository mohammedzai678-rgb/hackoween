cutoff_date: '2021-12-31'
data:
  cache_dir: data/cache
  manifest_path: data/manifest.json
  openmeteo:
    backoff_factor: 2.0
    base_url: https://archive-api.open-meteo.com/v1/archive
    daily_vars: precipitation_sum,temperature_2m_max,temperature_2m_min,soil_moisture_0_to_7cm
    max_retries: 3
    rate_limit_sleep: 0.5
  processed_dir: data/processed
  raw_dir: data/raw
  starter_dir: data/raw/starter
  streamstats:
    base_url: https://streamstats.usgs.gov/streamstatsservices/
    characteristics:
    - DRNAREA
    - ELEV
    - SLOPE_PCT
    - FOREST
    fallback: gagesii
  usgs:
    base_url: https://waterservices.usgs.gov/nwis/dv/
    completeness_threshold: 0.8
    format: json
    parameter_cd: '00060'
    site_info_url: https://waterservices.usgs.gov/nwis/site/
    start_date: '2010-01-01'
    stations:
    - '01646500'
    - '07010000'
    - 08158000
    - 02087500
    - '11447650'
    - '01010000'
    - '01047000'
    - 01184000
    - '01463500'
    - '02037500'
    - 02085070
    - '02146000'
    - '02175000'
    - 02298830
    - '02321500'
    - '03254520'
    - 03339000
    - '03612500'
    - 05587450
    - '06054500'
    - '06610000'
    - 06807000
    - '07032000'
    - '07261000'
    - 08070000
    - 08082000
    - 09380000
    - '10128500'
    - '11303500'
    - '12354500'
    - '14211720'
    - '12413000'
features:
  antecedent:
    decay_constants:
    - 0.5
    - 0.8
    - 0.95
    enabled: true
  calendar:
    enabled: true
  cross_station:
    enabled: true
  rainfall:
    days_since_rain_mm:
    - 5
    - 10
    - 25
    enabled: true
    max_rain_windows:
    - 3
    - 7
    - 14
    percentile_threshold: 0.95
    rolling_windows:
    - 1
    - 2
    - 3
    - 7
    - 14
    - 30
    - 60
    wet_day_thresholds_mm:
    - 1
    - 5
    wet_day_windows:
    - 7
    - 14
    - 30
  soil:
    enabled: true
    lag_days:
    - 1
    - 3
    - 7
  static:
    enabled: true
  station_stats:
    enabled: true
    percentiles:
    - 0.75
    - 0.9
    - 0.99
  temperature:
    degree_day_windows:
    - 7
    - 14
    - 30
    enabled: true
    snow_threshold_c: 1.0
model:
  bagging_fraction: 0.8
  bagging_freq: 1
  early_stopping_rounds: 200
  feature_fraction: 0.7
  lambda_l2: 5.0
  learning_rate: 0.03
  metric: rmse
  min_child_samples: 40
  n_estimators: 5000
  n_jobs: -1
  num_leaves: 63
  objective: regression
  seed: 42
  target_strategy: raw
  type: lightgbm
output:
  ablations_log: experiments/ablations.csv
  artifacts_dir: artifacts
  predictions_path: predictions.csv
  runs_log: experiments/runs.jsonl
seed: 42
validation:
  expanding_window_folds: 3
  leave_one_station_out: true
  scheme: forward_time
  val_years: 1
