services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: floodcast-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - FLOODCAST_CONFIG=configs/base.yaml
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./experiments:/app/experiments
      - ./artifacts:/app/artifacts
      - ./docs:/app/docs
      - ./configs:/app/configs
      - ./predictions.csv:/app/predictions.csv:ro
      - ./README.md:/app/README.md:ro
      - ./model_card.md:/app/model_card.md:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodcast-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - INTERNAL_API_URL=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
